name: Container release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Build and scan release image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for vulnerability scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: custom-db:release-scan
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Fail on high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: custom-db:release-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  publish:
    name: Publish, sign, and verify multi-architecture image
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/aditya-deshwal23/custom-db
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push with SPDX SBOM and provenance attestations
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign pushed image digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/aditya-deshwal23/custom-db@${IMAGE_DIGEST}"
      - name: Verify the published digest signature
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Aditya-Deshwal23/CUSTOM-DB/.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/aditya-deshwal23/custom-db@${IMAGE_DIGEST}"

  create-release:
    name: Publish GitHub release notes and supply-chain assets
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify published image signature
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Aditya-Deshwal23/CUSTOM-DB/.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/aditya-deshwal23/custom-db@${IMAGE_DIGEST}"
      - name: Prepare release asset directory
        run: mkdir -p dist
      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ghcr.io/aditya-deshwal23/custom-db@${{ needs.publish.outputs.image_digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/custom-db.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Capture the OCI index containing BuildKit SBOM and provenance attestations
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          mkdir -p dist
          docker buildx imagetools inspect --raw \
            "ghcr.io/aditya-deshwal23/custom-db@${IMAGE_DIGEST}" \
            > dist/oci-index-with-attestations.json
      - name: Create GitHub release and attach supply-chain assets
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "${notes}" ]]; then
            echo "Missing release notes: ${notes}" >&2
            exit 1
          fi
          printf '%s\n' \
            "image=ghcr.io/aditya-deshwal23/custom-db@${IMAGE_DIGEST}" \
            "sbom=custom-db.spdx.json" \
            "provenance=oci-index-with-attestations.json (BuildKit in-toto attestations)" \
            > dist/supply-chain.txt
          gh release create "${GITHUB_REF_NAME}" \
            --title "CUSTOM-DB ${GITHUB_REF_NAME}" \
            --notes-file "${notes}" \
            --verify-tag \
            docs/assets/recovery.cast \
            dist/custom-db.spdx.json \
            dist/oci-index-with-attestations.json \
            dist/supply-chain.txt
