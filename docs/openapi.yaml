openapi: 3.1.0
info:
  title: Custom DB API
  version: 1.0.0
  description: HTTP API for the Custom DB SQL engine.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: liveness
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    const: true
  /readyz:
    get:
      operationId: readiness
      responses:
        "200":
          description: Recovery has completed and the database is writable.
        "503":
          description: Database is recovering or the service is draining.
  /api/v1/query:
    post:
      operationId: executeQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
            examples:
              parameterizedSelect:
                summary: Parameterized SQL query
                value:
                  sql: "SELECT id FROM documented WHERE id = $1"
                  params: [31]
              legacyQueryField:
                summary: Deprecated query field compatibility
                value:
                  query: "SELECT id FROM documented WHERE id = 31"
      responses:
        "200":
          description: Query result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuerySuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "415":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
        "507":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /api/v1/query/{request_id}:
    delete:
      operationId: cancelQuery
      description: Requests cooperative cancellation of an active query or batch. Cancellation checks occur during execution and before transaction commit. The general API rate-limit bucket applies; X-API-Key is required when configured.
      parameters:
        - in: path
          name: request_id
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._-]+$'
        - in: header
          name: X-API-Key
          required: false
          description: Required when the server has API_KEY configured.
          schema:
            type: string
            maxLength: 4096
        - in: header
          name: X-Request-Id
          required: false
          schema:
            type: string
            maxLength: 128
      responses:
        "202":
          description: Cancellation was signalled to an active statement.
          content:
            application/json:
              schema:
                type: object
                required: [ok, request_id, state]
                properties:
                  ok:
                    const: true
                  request_id:
                    type: string
                  state:
                    const: cancellation_requested
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/activity:
    get:
      operationId: listActiveQueries
      description: Returns at most 100 active single-statement or batch requests. Inspector rate-limit class; disabled when INSPECT_ENABLED=0. X-API-Key is required when API_KEY is configured. SQL previews contain only statement kinds, never parameter values.
      parameters:
        - in: header
          name: X-API-Key
          required: false
          description: Required when the server has API_KEY configured.
          schema:
            type: string
            maxLength: 4096
      responses:
        "200":
          description: Bounded currently active request list.
          content:
            application/json:
              schema:
                type: object
                required: [activity]
                properties:
                  activity:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      required: [request_id, state, sql_preview, elapsed_ms]
                      properties:
                        request_id:
                          type: string
                          maxLength: 128
                        state:
                          const: running
                        sql_preview:
                          type: string
                          maxLength: 64
                        elapsed_ms:
                          type: integer
                          minimum: 0
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/batch:
    post:
      operationId: executeAtomicBatch
      description: Executes up to 50 statements on one exclusive gate and one durable WAL transaction. Write batches require X-API-Key when configured and are unavailable in READ_ONLY mode. Multi-request transaction sessions are not supported.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BatchRequest"
      responses:
        "200":
          description: The batch committed atomically, or an explicit script ROLLBACK was accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BatchSuccess"
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "409":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
        "507":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /api/v1/tables:
    get:
      operationId: listTables
      responses:
        "200":
          description: Database table names.
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items:
                      type: string
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/tables/{name}:
    get:
      operationId: getTable
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            maxLength: 256
            pattern: '^[A-Za-z_][A-Za-z0-9_$]{0,255}$'
      responses:
        "200":
          description: Table schema and observed row count.
          content:
            application/json:
              schema:
                type: object
                required: [name, schema, row_estimate, indexes]
                properties:
                  name:
                    type: string
                  schema:
                    type: array
                    items:
                      $ref: "#/components/schemas/Column"
                  row_estimate:
                    type: integer
                    minimum: 0
                  indexes:
                    type: array
                    items:
                      type: object
                      required: [name, column, unique]
                      properties:
                        name:
                          type: string
                        column:
                          type: string
                        unique:
                          type: boolean
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/tables/{name}/rows:
    get:
      operationId: inspectTableRows
      description: Returns at most 500 typed rows using replacement-neutral reads, a 100000-row examination cap, INSPECT_MAX_PAGES, and STATEMENT_TIMEOUT_MS. Cursor order is the requested column followed by RID; inspector rate-limit class and API_KEY authentication policy apply.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            maxLength: 256
            pattern: '^[A-Za-z_][A-Za-z0-9_$]{0,255}$'
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - in: query
          name: after
          required: false
          description: Opaque cursor returned by the prior page; it is bound to the table, ordering column, and direction.
          schema:
            type: string
            maxLength: 9000
        - in: query
          name: order
          required: false
          description: Column name, optionally suffixed with :desc. Defaults to the primary key or first column.
          schema:
            type: string
            maxLength: 256
        - in: query
          name: filter
          required: false
          description: JSON object or array of up to 16 structured predicates. Operators are =, <>, <, <=, >, >=, LIKE, and ISNULL; values are validated against the column type.
          schema:
            type: string
            maxLength: 8192
          examples:
            activeCustomers:
              value: '{"column":"active","op":"=","value":true}'
        - in: header
          name: X-API-Key
          required: false
          description: Required when the server has API_KEY configured.
          schema:
            type: string
            maxLength: 4096
            pattern: '^[\x20-\x7E\x80-\xFF]{0,4096}$'
      responses:
        "200":
          description: Bounded page of typed table rows.
          content:
            application/json:
              schema:
                type: object
                required: [columns, rows, row_count, next_cursor]
                properties:
                  columns:
                    type: array
                    items:
                      $ref: "#/components/schemas/Column"
                  rows:
                    type: array
                    maxItems: 500
                    items:
                      type: object
                      required: [rid, values]
                      properties:
                        rid:
                          type: string
                          pattern: "^[0-9]+:[0-9]+$"
                        values:
                          type: object
                          additionalProperties:
                            type: [string, integer, number, boolean, "null"]
                  row_count:
                    type: integer
                    maximum: 500
                  next_cursor:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /api/v1/stats:
    get:
      operationId: getStats
      responses:
        "200":
          description: Live SQL, HTTP, buffer-pool, disk, WAL, and process metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  buffer_pool:
                    type: object
                  disk:
                    type: object
                  statements:
                    type: object
                  statement_duration_us:
                    type: object
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/snapshot:
    get:
      operationId: getSnapshot
      description: Combined bounded live snapshot with an ETag validator. Inspector routes use the separate inspect rate-limit bucket; X-API-Key is required when API_KEY is configured.
      parameters:
        - in: header
          name: X-API-Key
          required: false
          description: Required when the server has API_KEY configured.
          schema:
            type: string
            maxLength: 4096
            pattern: '^[\x20-\x7E\x80-\xFF]{0,4096}$'
        - in: header
          name: If-None-Match
          required: false
          schema:
            type: string
            maxLength: 256
            pattern: '^[\x20-\x7E\x80-\xFF]{0,256}$'
      responses:
        "200":
          description: Combined engine, runtime, storage, pool, WAL, and activity snapshot.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [ts_ms, engine, stats, storage, pool, wal, activity]
                properties:
                  ts_ms:
                    type: integer
                  engine:
                    type: object
                  stats:
                    type: object
                  storage:
                    type: object
                  pool:
                    type: object
                  wal:
                    type: object
                  activity:
                    type: object
        "304":
          description: Snapshot representation has not changed.
          headers:
            ETag:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/catalog:
    get:
      operationId: getCatalog
      description: Returns all tables and their bounded storage metadata in one read-only request. Inspector routes use the separate inspect rate-limit bucket; X-API-Key is required when API_KEY is configured.
      parameters:
        - in: header
          name: X-API-Key
          required: false
          description: Required when the server has API_KEY configured.
          schema:
            type: string
            maxLength: 4096
            pattern: '^[\x20-\x7E\x80-\xFF]{0,4096}$'
      responses:
        "200":
          description: Full catalog within the 8 MiB response limit.
          headers:
            ETag:
              description: Stable validator for conditional catalog refresh.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                required: [tables]
                properties:
                  tables:
                    type: array
                    items:
                      type: object
                      properties:
                        heap:
                          type: object
                          properties:
                            free_space_histogram:
                              type: array
                              minItems: 4
                              maxItems: 4
                              items:
                                type: object
                                required: [range, pages]
                                properties:
                                  range:
                                    type: string
                                    enum: ["0-25%", "25-50%", "50-75%", "75-100%"]
                                  pages:
                                    type: integer
                                    minimum: 0
        "304":
          description: Catalog has not changed.
          headers:
            ETag:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "413":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/stats/history:
    get:
      operationId: getMetricsHistory
      description: Server-side one-sample-per-second ring; output is columnar and bounded to 3600 samples.
      parameters:
        - in: query
          name: window_s
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 3600
            default: 900
        - in: query
          name: step_s
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 60
            default: 1
      responses:
        "200":
          description: Columnar timestamp and metric series.
          content:
            application/json:
              schema:
                type: object
                required: [ts_ms, series, step_s]
                properties:
                  ts_ms:
                    type: array
                    maxItems: 3600
                    items:
                      type: integer
                  series:
                    type: object
                  step_s:
                    type: integer
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/slow-queries:
    get:
      operationId: getSlowQueries
      description: Returns up to 100 sampled slow-query previews. Parameter values are never included.
      responses:
        "200":
          description: Bounded slow-query ring buffer.
          content:
            application/json:
              schema:
                type: object
                required: [queries]
                properties:
                  queries:
                    type: array
                    maxItems: 100
                    items:
                      type: object
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/inspect/pages:
    get:
      operationId: getPageTypeMap
      description: Returns a one-byte-per-page page-type map without loading pages into or perturbing buffer-pool replacement state.
      parameters:
        - in: query
          name: from
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
            default: 0
        - in: query
          name: count
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 4096
            default: 256
      responses:
        "200":
          description: Compact base64 page-type map.
          content:
            application/json:
              schema:
                type: object
                required: [from, count, total, page_types_base64, corrupt_pages]
                properties:
                  from:
                    type: integer
                  count:
                    type: integer
                    maximum: 4096
                  total:
                    type: integer
                  page_types_base64:
                    type: string
                  corrupt_pages:
                    type: integer
        "400":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/inspect/pages/{page_id}:
    get:
      operationId: inspectPage
      description: Defensive page decoder. Raw page bytes require INSPECT_RAW_BYTES=1 and raw=1.
      parameters:
        - in: path
          name: page_id
          required: true
          schema:
            type: integer
            minimum: 0
            maximum: 2147483647
        - in: query
          name: raw
          required: false
          schema:
            type: integer
            enum: [0, 1]
            default: 0
      responses:
        "200":
          description: Decoded page, checksum result, and bounded byte regions.
          content:
            application/json:
              schema:
                type: object
                required: [page_id, type, crc_ok, lsn, decoded, regions]
                properties:
                  page_id:
                    type: integer
                  type:
                    type: string
                  crc_ok:
                    type: boolean
                  lsn:
                    type: integer
                  decoded:
                    type: object
                    description: B+ tree keys include key_base64 and a typed key when the owning index schema is resolvable.
                  regions:
                    type: array
                  hex_base64:
                    type: string
        "400":
          $ref: "#/components/responses/ApiError"
        "422":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "403":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/inspect/wal:
    get:
      operationId: inspectWal
      description: Returns a bounded tail of validated WAL records. Inspector rate-limit class; X-API-Key is required when API_KEY is configured.
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - in: query
          name: before_lsn
          required: false
          schema:
            type: integer
            minimum: 0
        - in: header
          name: X-API-Key
          required: false
          description: Required when the server has API_KEY configured.
          schema:
            type: string
            maxLength: 4096
            pattern: '^[\x20-\x7E\x80-\xFF]{0,4096}$'
      responses:
        "200":
          description: Validated WAL record tail and commit boundaries.
          content:
            application/json:
              schema:
                type: object
                required: [records, commit_lsns, size_bytes, base_lsn, truncated]
                properties:
                  records:
                    type: array
                    maxItems: 500
                    items:
                      type: object
                      required: [lsn, type, txn_id, page_id, payload_bytes, crc_ok, file_offset]
                      properties:
                        lsn:
                          type: integer
                        type:
                          type: string
                          enum: [PAGE_IMAGE, COMMIT, CHECKPOINT]
                        txn_id:
                          type: integer
                        page_id:
                          type: [integer, "null"]
                        payload_bytes:
                          type: integer
                        crc_ok:
                          type: boolean
                        file_offset:
                          type: integer
                  commit_lsns:
                    type: array
                    items:
                      type: integer
                  size_bytes:
                    type: integer
                  base_lsn:
                    type: integer
                  truncated:
                    type: boolean
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /api/v1/inspect/indexes/{name}/tree:
    get:
      operationId: inspectIndexTree
      description: Returns a bounded tree walk from the real B+ tree pages using replacement-neutral reads. Inspector rate-limit class; X-API-Key is required when API_KEY is configured.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            maxLength: 256
            pattern: '^[A-Za-z_][A-Za-z0-9_$]{0,255}$'
        - in: query
          name: max_nodes
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 200
        - in: header
          name: X-API-Key
          required: false
          description: Required when the server has API_KEY configured.
          schema:
            type: string
            maxLength: 4096
            pattern: '^[\x20-\x7E\x80-\xFF]{0,4096}$'
      responses:
        "200":
          description: Bounded B+ tree node listing.
          content:
            application/json:
              schema:
                type: object
                required: [nodes, truncated]
                properties:
                  nodes:
                    type: array
                    maxItems: 200
                    items:
                      type: object
                      required: [page_id, level, count, min_key, max_key, children, next, fill_pct]
                      properties:
                        page_id:
                          type: integer
                        level:
                          type: integer
                        count:
                          type: integer
                        min_key:
                          description: Typed SQL key; VARCHAR keys expose their stored hash as hash_base64.
                          type: [integer, number, boolean, string, object, "null"]
                        max_key:
                          description: Typed SQL key; VARCHAR keys expose their stored hash as hash_base64.
                          type: [integer, number, boolean, string, object, "null"]
                        children:
                          type: array
                          items:
                            type: integer
                        next:
                          type: [integer, "null"]
                        fill_pct:
                          type: number
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /api/v1/inspect/indexes/{name}/trace:
    get:
      operationId: traceIndexLookup
      description: Runs the B+ tree's actual key-selection and leaf-search logic with a TraceSink and replacement-neutral reads. Inspector rate-limit class; X-API-Key is required when API_KEY is configured.
      parameters:
        - in: path
          name: name
          required: true
          schema:
            type: string
            maxLength: 256
            pattern: '^[A-Za-z_][A-Za-z0-9_$]{0,255}$'
        - in: query
          name: key
          required: true
          schema:
            type: string
            maxLength: 1024
        - in: header
          name: X-API-Key
          required: false
          description: Required when the server has API_KEY configured.
          schema:
            type: string
            maxLength: 4096
            pattern: '^[\x20-\x7E\x80-\xFF]{0,4096}$'
      responses:
        "200":
          description: Exact page decisions and matching record identifier if found.
          content:
            application/json:
              schema:
                type: object
                required: [path, found, rid]
                properties:
                  path:
                    type: array
                    maxItems: 16
                    items:
                      type: object
                      required: [page_id, level, slot, decision]
                      properties:
                        page_id:
                          type: integer
                        level:
                          type: integer
                        slot:
                          type: integer
                        decision:
                          type: string
                  found:
                    type: boolean
                  rid:
                    type: [string, "null"]
        "400":
          $ref: "#/components/responses/ApiError"
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /api/v1/inspect/freelist:
    get:
      operationId: inspectFreeList
      description: Walks and validates the bounded free-page chain without changing buffer-pool replacement state. Inspector rate-limit class; X-API-Key is required when API_KEY is configured.
      parameters:
        - in: header
          name: X-API-Key
          required: false
          description: Required when the server has API_KEY configured.
          schema:
            type: string
            maxLength: 4096
            pattern: '^[\x20-\x7E\x80-\xFF]{0,4096}$'
      responses:
        "200":
          description: Free page IDs; truncated is true if the configured inspection cap was reached.
          content:
            application/json:
              schema:
                type: object
                required: [pages, truncated]
                properties:
                  pages:
                    type: array
                    maxItems: 4096
                    items:
                      type: integer
                      minimum: 0
                  truncated:
                    type: boolean
        "401":
          $ref: "#/components/responses/ApiError"
        "404":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "500":
          $ref: "#/components/responses/ApiError"
  /api/v1/stats/buffer_pool:
    get:
      operationId: getBufferPoolSnapshot
      parameters:
        - in: query
          name: format
          required: false
          description: Use legacy to request the deprecated per-frame object array. Default is compact base64 state bytes.
          schema:
            type: string
            enum: [compact, legacy]
            maxLength: 7
            default: compact
      responses:
        "200":
          description: Compact per-frame buffer-pool states; format=legacy retains the previous object array.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pool_size:
                    type: integer
                  snapshot_size:
                    type: integer
                  encoding:
                    type: string
                    const: base64-state-v1
                  states_base64:
                    type: string
                  frames:
                    type: array
                    items:
                      type: object
        "400":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/stats/storage:
    get:
      operationId: getStorageStats
      responses:
        "200":
          description: Live database, free-page, WAL, checkpoint, and recovery statistics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_size_bytes:
                    type: integer
                  page_count:
                    type: integer
                  free_pages:
                    type: integer
                  wal_size_bytes:
                    type: integer
                  recovery:
                    type: object
        "429":
          $ref: "#/components/responses/ApiError"
  /metrics:
    get:
      operationId: prometheusMetrics
      responses:
        "200":
          description: Prometheus text exposition format 0.0.4 from live counters and timers.
          content:
            text/plain:
              schema:
                type: string
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/version:
    get:
      operationId: getVersion
      responses:
        "200":
          description: Build and on-disk format information.
          content:
            application/json:
              schema:
                type: object
                required: [git_sha, build_time, format_version]
                properties:
                  git_sha:
                    type: string
                  build_time:
                    type: string
                  format_version:
                    type: integer
        "429":
          $ref: "#/components/responses/ApiError"
  /api/v1/admin/checkpoint:
    post:
      operationId: checkpoint
      parameters:
        - in: header
          name: X-API-Key
          required: false
          description: Required when the server has API_KEY configured; valid HTTP field value, at most 4096 bytes.
          schema:
            type: string
            maxLength: 4096
            pattern: '^[\x20-\x7E\x80-\xFF]{0,4096}$'
      security:
        - ApiKey: []
      responses:
        "200":
          description: Checkpoint completed.
        "401":
          $ref: "#/components/responses/ApiError"
        "429":
          $ref: "#/components/responses/ApiError"
        "503":
          $ref: "#/components/responses/ApiError"
  /health:
    get:
      deprecated: true
      responses:
        "200":
          description: Deprecated liveness alias.
        "429":
          $ref: "#/components/responses/ApiError"
  /api/metrics:
    get:
      deprecated: true
      responses:
        "200":
          description: Deprecated JSON metrics alias.
        "429":
          $ref: "#/components/responses/ApiError"
  /api/query:
    post:
      deprecated: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
      responses:
        "200":
          description: Deprecated query response shape.
        "400":
          description: The legacy request body is invalid.
        "429":
          $ref: "#/components/responses/ApiError"
components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    QueryRequest:
      type: object
      properties:
        sql:
          type: string
          maxLength: 16384
        query:
          type: string
          deprecated: true
        params:
          type: array
          items:
            type: [string, integer, number, boolean, "null"]
      oneOf:
        - required: [sql]
        - required: [query]
    BatchStatement:
      type: object
      required: [sql]
      properties:
        sql:
          type: string
          minLength: 1
          maxLength: 16384
        params:
          type: array
          items:
            type: [string, integer, number, boolean, "null"]
    BatchRequest:
      type: object
      oneOf:
        - required: [statements]
          properties:
            statements:
              type: array
              minItems: 1
              maxItems: 50
              items:
                $ref: "#/components/schemas/BatchStatement"
        - required: [script]
          properties:
            script:
              type: string
              minLength: 1
              maxLength: 16384
              description: Must start with BEGIN; and end with COMMIT; or ROLLBACK;.
            params:
              type: array
              maxItems: 50
              items:
                type: [string, integer, number, boolean, "null"]
    BatchSuccess:
      type: object
      required: [ok, committed, results]
      properties:
        ok:
          const: true
        committed:
          type: boolean
        commit:
          type: object
          required: [status, durable]
          properties:
            status:
              type: string
              enum: [committed, rolled_back]
            durable:
              type: boolean
            wal_commit_count:
              type: integer
              minimum: 0
        results:
          type: array
          maxItems: 50
          items:
            type: object
            required: [statement, message, rows_affected, columns, rows, row_count, truncated]
            properties:
              statement:
                type: string
              message:
                type: string
              rows_affected:
                type: integer
                minimum: 0
              columns:
                type: array
                items:
                  $ref: "#/components/schemas/Column"
              rows:
                type: array
                items:
                  type: array
                  items:
                    type: [string, integer, number, boolean, "null"]
              row_count:
                type: integer
                minimum: 0
              truncated:
                type: boolean
    Column:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
        type:
          type: string
        primary_key:
          type: boolean
        references:
          oneOf:
            - type: "null"
            - type: object
              required: [table, column]
              properties:
                table:
                  type: string
                column:
                  type: string
    QuerySuccess:
      type: object
      required:
        - ok
        - statement
        - columns
        - rows
        - row_count
        - rows_affected
        - truncated
        - elapsed_us
        - pages_touched
      properties:
        ok:
          const: true
        statement:
          type: string
        columns:
          type: array
          items:
            $ref: "#/components/schemas/Column"
        rows:
          type: array
          items:
            type: array
            items:
              type: [string, integer, number, boolean, "null"]
        row_count:
          type: integer
          minimum: 0
        rows_affected:
          type: integer
          minimum: 0
        truncated:
          type: boolean
        elapsed_us:
          type: integer
          minimum: 0
        pages_touched:
          type: object
          required: [hit, miss]
          properties:
            hit:
              type: integer
              minimum: 0
            miss:
              type: integer
              minimum: 0
        commit:
          type: object
          required: [lsn, pages_written, bytes, fsync_us]
          properties:
            lsn:
              type: integer
              minimum: 0
            pages_written:
              type: integer
              minimum: 0
            bytes:
              type: integer
              minimum: 0
            fsync_us:
              type: integer
              minimum: 0
        plan:
          type: string
        deprecated:
          type: boolean
  responses:
    ApiError:
      description: Structured API error; internal failures never include stack traces.
      content:
        application/json:
          schema:
            type: object
            required: [ok, error, request_id]
            properties:
              ok:
                const: false
              error:
                type: object
                required: [code, message, line, column, hint]
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  line:
                    type: integer
                    minimum: 0
                  column:
                    type: integer
                    minimum: 0
                  hint:
                    type: string
                  statement_index:
                    type: integer
                    minimum: 0
              request_id:
                type: string
