name: Container release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: Build and scan release image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image for vulnerability scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: custom-db:release-scan
          build-args: |
            VERSION=${{ github.ref_name }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Fail on high or critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: custom-db:release-scan
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  publish:
    name: Publish, sign, and verify multi-architecture image
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/aditya-deshwal23/custom-db
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push with SPDX SBOM and provenance attestations
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            VCS_REF=${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - name: Sign pushed image digest with GitHub OIDC
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "ghcr.io/aditya-deshwal23/custom-db@${IMAGE_DIGEST}"
      - name: Verify the published digest signature
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Aditya-Deshwal23/CUSTOM-DB/.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/aditya-deshwal23/custom-db@${IMAGE_DIGEST}"

  create-release:
    name: Publish GitHub release notes and supply-chain assets
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Install cosign
        uses: sigstore/cosign-installer@3454372f43399081ed03b604cb2d021dabca52bb # v3.8.2
      - name: Verify published image signature
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          cosign verify \
            --certificate-identity-regexp '^https://github\.com/Aditya-Deshwal23/CUSTOM-DB/.github/workflows/release\.yml@refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "ghcr.io/aditya-deshwal23/custom-db@${IMAGE_DIGEST}"
      - name: Prepare release asset directory
        run: mkdir -p dist
      - name: Generate image SPDX SBOM
        uses: anchore/sbom-action@fc46e51fd3cb168ffb36c6d1915723c47db58abb # v0.17.7
        with:
          image: ghcr.io/aditya-deshwal23/custom-db@${{ needs.publish.outputs.image_digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/custom-db.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Capture the OCI index containing BuildKit SBOM and provenance attestations
        env:
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          mkdir -p dist
          docker buildx imagetools inspect --raw \
            "ghcr.io/aditya-deshwal23/custom-db@${IMAGE_DIGEST}" \
            > dist/oci-index-with-attestations.json
      - name: Create GitHub release and attach supply-chain assets
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_DIGEST: ${{ needs.publish.outputs.image_digest }}
        run: |
          notes="docs/releases/${GITHUB_REF_NAME}.md"
          if [[ ! -f "${notes}" ]]; then
            echo "Missing release notes: ${notes}" >&2
            exit 1
          fi
          printf '%s\n' \
            "image=ghcr.io/aditya-deshwal23/custom-db@${IMAGE_DIGEST}" \
            "sbom=custom-db.spdx.json" \
            "provenance=oci-index-with-attestations.json (BuildKit in-toto attestations)" \
            > dist/supply-chain.txt
          gh release create "${GITHUB_REF_NAME}" \
            --title "CUSTOM-DB ${GITHUB_REF_NAME}" \
            --notes-file "${notes}" \
            --verify-tag \
            docs/assets/recovery.cast \
            dist/custom-db.spdx.json \
            dist/oci-index-with-attestations.json \
            dist/supply-chain.txt
