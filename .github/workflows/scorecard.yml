name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Publish SARIF to code scanning
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
      - name: Upload Scorecard SARIF report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          if-no-files-found: error
      - name: Enforce minimum Scorecard score when indexed
        run: |
          response_file="$(mktemp)"
          trap 'rm -f "${response_file}"' EXIT
          status="$(curl --silent --show-error --max-time 10 \
            --output "${response_file}" --write-out '%{http_code}' \
            https://api.scorecard.dev/projects/github.com/Aditya-Deshwal23/CUSTOM-DB)"
          if [[ "${status}" != "200" ]]; then
            echo "::warning::Scorecard result is not indexed yet (HTTP ${status}); the >=7 requirement remains unverified."
            exit 0
          fi
          score="$(jq --exit-status --raw-output '.score | numbers' "${response_file}")" || {
            echo "::warning::Scorecard API returned no numeric score; the >=7 requirement remains unverified."
            exit 0
          }
          printf 'OpenSSF Scorecard score: %s\n' "${score}"
          awk -v score="${score}" 'BEGIN { exit !(score >= 7) }' || {
            echo "OpenSSF Scorecard score ${score} is below the required 7" >&2
            exit 1
          }
