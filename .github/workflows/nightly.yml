name: Nightly storage checks

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  concurrency-tsan-stress:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure ThreadSanitizer build
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DRELDB_SANITIZE=thread -DRELDB_WERROR=ON
      - name: Build regression tests
        run: cmake --build build-tsan --parallel --target reldb_regression_tests
      - name: Prepare TSan runtime
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Run 60-second seeded SQL concurrency stress
        env:
          RELDB_CONCURRENCY_STRESS_SECONDS: "60"
        run: build-tsan/reldb_regression_tests --gtest_filter=ConcurrencyTest.SqlExecutorStatementGateTsanStress

  crash-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRELDB_WERROR=ON
      - name: Build regression tests
        run: cmake --build build --parallel --target reldb_regression_tests
      - name: Run 5,000 seeded hard-kill iterations
        run: tools/crashtest build/reldb_regression_tests 5000

  exhaustive-page-checksum:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRELDB_WERROR=ON
      - name: Build tests
        run: cmake --build build --parallel --target reldb_regression_tests
      - name: Exhaustively flip every page bit
        env:
          RELDB_EXHAUSTIVE_PAGE_CHECKSUM: "1"
        run: build/reldb_regression_tests --gtest_filter=DiskManagerTest.DetectsSingleBitErrorsInSampledOrExhaustivePageBits

  sql-grammar-fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure Clang libFuzzer target
        run: CC=clang CXX=clang++ cmake -S . -B build-fuzz -DCMAKE_BUILD_TYPE=Debug -DRELDB_BUILD_FUZZERS=ON -DRELDB_BUILD_BENCHMARKS=OFF -DRELDB_BUILD_TESTS=OFF
      - name: Build SQL grammar fuzzer
        run: cmake --build build-fuzz --target sql_grammar_fuzz --parallel
      - name: Fuzz SQL grammar under ASan and UBSan for ten minutes
        run: build-fuzz/sql_grammar_fuzz tests/sql_fuzz_corpus -max_total_time=600 -timeout=5
