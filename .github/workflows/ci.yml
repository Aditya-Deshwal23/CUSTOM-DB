name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DRELDB_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install strace for the Linux sync check
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Verify disk sync syscalls
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: scripts/verify_disk_syncs.sh build/reldb_disk_sync_probe
      - name: Check metrics honesty
        run: build/reldb_regression_tests --gtest_filter=MetricsTest.NoFabricatedValues
      - name: Check dashboard honesty
        run: python3 scripts/check_dashboard_honesty.py
      - name: SQLite SQL differential (10,000 statements)
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: python3 tools/difftest.py --binary build/relational_db --statements 10000
      - name: Verify SQL execution benchmark target
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: cmake --build build --target reldb_sql_execution_benchmarks --parallel
      - name: Smoke-test the SQLite comparison benchmark
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: python3 tools/benchmark_sqlite.py --binary build/relational_db --rows 1000 --iterations 100 --repetitions 1 --seed 1337
      - name: Verify HTTP examples and shutdown
        run: scripts/verify_resume_claims.sh
      - name: Set up Python for API contract tests
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: |
          python -m pip install --require-hashes -r tests/api/requirements.txt
          python -m pip install --require-hashes -r tests/dashboard/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run real-binary API contract tests
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        env:
          RELDB_SERVER_BINARY: ${{ github.workspace }}/build/relational_db
        run: python -m pytest -q tests/api
      - name: Verify warm snapshot p99
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Release'
        run: python tools/benchmark_snapshot.py --binary build/relational_db --samples 100 --max-p99-ms 2
      - name: Run real-binary dashboard browser smoke test
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        env:
          RELDB_SERVER_BINARY: ${{ github.workspace }}/build/relational_db
        run: python -m pytest -q tests/dashboard
      - name: Lighthouse performance and accessibility audit
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: python scripts/run_lighthouse.py --binary build/relational_db --output docs/lighthouse-report.json
      - name: Fuzz HTTP API input (200 seeded requests)
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: python tests/api/fuzz_api.py --binary build/relational_db --iterations 200 --seed 731291
      - name: Print known-bug table
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: scripts/run_known_bugs.sh build/reldb_regression_tests
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/server.log
          if-no-files-found: ignore

  coverage:
    name: gcovr component coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install gcovr
        run: python -m pip install gcovr
      - name: Configure coverage build
        run: >-
          cmake -S . -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DRELDB_WERROR=ON
          -DRELDB_BUILD_BENCHMARKS=OFF
          -DCMAKE_CXX_FLAGS="--coverage -fprofile-abs-path -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS=--coverage
      - name: Build and run tests
        run: |
          cmake --build build-coverage --parallel
          ctest --test-dir build-coverage --output-on-failure
      - name: Generate gcovr reports for storage, index, WAL, and SQL
        run: |
          set -euo pipefail
          mkdir -p coverage
          {
            echo "# Line coverage by component"
            echo
            echo "Target: at least 80% line coverage for each listed component."
            echo "This report publishes measured coverage; the target is not asserted until the baseline meets it."
            echo "gcovr warns and skips negative/suspicious hit counts caused by GCC bug 68080; coverage data for affected lines and branches can be incomplete."
            for component in storage index wal sql; do
              case "${component}" in
                storage) filter='src/storage/.*|src/slotted_page\.cpp' ;;
                index) filter='src/b_plus_tree\.cpp|src/catalog\.cpp' ;;
                wal) filter='src/wal\.cpp|src/crc32c\.cpp' ;;
                sql) filter='src/sql_parser\.cpp|src/sql_executor\.cpp|src/executor\.cpp' ;;
              esac
              gcovr --root . --filter "${filter}" \
                --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
                --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file \
                --txt-summary \
                > "coverage/${component}-summary.txt"
              gcovr --root . --filter "${filter}" \
                --gcov-ignore-parse-errors=negative_hits.warn_once_per_file \
                --gcov-ignore-parse-errors=suspicious_hits.warn_once_per_file \
                --html-details "coverage/${component}.html"
              echo "## ${component}"
              echo '```text'
              cat "coverage/${component}-summary.txt"
              echo '```'
              echo
            done
          } | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Upload component coverage reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: gcovr-component-coverage
          path: coverage/
          if-no-files-found: error

  link-check:
    name: Markdown link check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Check documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --verbose --no-progress --exclude '^https://api\.scorecard\.dev/projects/github\.com/Aditya-Deshwal23/CUSTOM-DB/badge$' README.md docs/ LICENSE DIFFICULTIES_FACED.md
          fail: true

  asan-ubsan:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DRELDB_SANITIZE=address -DRELDB_WERROR=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
      - name: Set up Python for ASan API tests
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        run: python -m pip install --require-hashes -r tests/api/requirements.txt
      - name: Run API contract tests with ASan and UBSan binary
        env:
          RELDB_SERVER_BINARY: ${{ github.workspace }}/build-asan/relational_db
        run: python -m pytest -q tests/api
      - name: Fuzz API with ASan and UBSan (200 seeded requests)
        run: python tests/api/fuzz_api.py --binary build-asan/relational_db --iterations 200 --seed 731291
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-asan-ubsan
          path: build-asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  tsan:
    name: Thread sanitizer stress
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DRELDB_SANITIZE=thread -DRELDB_WERROR=ON
      - name: Build
        run: cmake --build build-tsan --parallel
      - name: Prepare TSan runtime
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Run disk manager TSan stress
        run: build-tsan/reldb_regression_tests --gtest_filter=DiskManagerTest.ConcurrentDistinctPageIo
      - name: Run statement-gate TSan stress
        shell: bash
        run: |
          set -o pipefail
          build-tsan/reldb_regression_tests --gtest_filter=ConcurrencyTest.ReaderWriterTsanClean | tee tsan.log
          build-tsan/reldb_regression_tests --gtest_filter=ConcurrencyTest.ExecutorStatementGateTsanClean | tee -a tsan.log
          RELDB_CONCURRENCY_STRESS_SECONDS=10 build-tsan/reldb_regression_tests --gtest_filter=ConcurrencyTest.SqlExecutorStatementGateTsanStress | tee -a tsan.log
      - name: Run WAL timer TSan stress
        run: build-tsan/reldb_regression_tests --gtest_filter=WalTest.NormalModeSyncThreadTsanClean
      - name: Fuzz API middleware concurrently under TSan (200 seeded requests)
        run: python3 tests/api/fuzz_api.py --binary build-tsan/relational_db --iterations 200 --seed 731291 --concurrent
      - name: Upload TSan log on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-logs-tsan
          path: tsan.log
          if-no-files-found: ignore

  crash-safety:
    name: WAL hard-kill recovery (200 iterations)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRELDB_WERROR=ON
      - name: Build regression tests
        run: cmake --build build --parallel --target reldb_regression_tests
      - name: Run seeded crash harness
        run: tools/crashtest build/reldb_regression_tests 200

  formatting-and-lint:
    name: Formatting and Dockerfile lint
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check changed C++ formatting
        run: |
          git fetch origin "${GITHUB_BASE_REF:-main}" --depth=1
          FORMAT_BASE="origin/${GITHUB_BASE_REF:-main}" scripts/format.sh --check
      - name: hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
      - name: Verify workflow hardening policy
        run: python3 scripts/check_workflow_controls.py
      - name: Validate Compose and shell scripts
        run: |
          docker compose config --quiet
          bash -n scripts/*.sh

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build image without pushing
        run: docker build --tag custom-db:ci --build-arg VERSION=ci --build-arg VCS_REF=${GITHUB_SHA} .
      - name: Record built image size
        run: |
          docker image ls --no-trunc --filter reference=custom-db:ci | tee image-size.txt
          cat image-size.txt >> "${GITHUB_STEP_SUMMARY}"
      - name: Dockle container configuration scan
        run: docker run --rm -v /var/run/docker.sock:/var/run/docker.sock goodwithtech/dockle:v0.4.15 --exit-code 1 --exit-level WARN custom-db:ci
      - name: Run the README quickstart against the built image
        env:
          IMAGE: custom-db:ci
          HOST_PORT: "18081"
        run: scripts/quickstart.sh
      - name: Verify container crash recovery and graceful shutdown
        env:
          IMAGE: custom-db:ci
          VOLUME: custom-db-ci-${{ github.run_id }}
          HOST_PORT: "18080"
        run: scripts/demo_crash.sh
      - name: Scan image for high and critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: custom-db:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

  hardening:
    name: Release binary hardening verification
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Configure hardened Release
        run: cmake -S . -B build-hardening -DCMAKE_BUILD_TYPE=Release -DRELDB_BUILD_TESTS=OFF -DRELDB_BUILD_BENCHMARKS=OFF -DRELDB_WERROR=ON
      - name: Build server binary
        run: cmake --build build-hardening --parallel --target relational_db
      - name: Install hardening checkers
        run: sudo apt-get update && sudo apt-get install -y checksec devscripts
      - name: Verify PIE, full RELRO, stack canary, NX, FORTIFY, and stack-clash protection
        run: scripts/check_binary_hardening.sh build-hardening/relational_db

  static-analysis:
    name: Cppcheck and clang-tidy (informational)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install analyzers
        run: sudo apt-get update && sudo apt-get install -y clang-tidy cppcheck
      - name: Configure compile database
        run: cmake -S . -B build-analysis -DCMAKE_BUILD_TYPE=Debug -DRELDB_BUILD_TESTS=OFF -DRELDB_BUILD_BENCHMARKS=OFF
      - name: Build core with conversion and shadow warnings
        run: cmake --build build-analysis --parallel --target reldb_core
      - name: Run cppcheck
        run: cppcheck --project=build-analysis/compile_commands.json --enable=warning,performance,portability --suppress=missingIncludeSystem --error-exitcode=0
      - name: Run clang-tidy security and correctness checks
        run: clang-tidy -p build-analysis -checks='bugprone-*,cert-*,clang-analyzer-security.*' src/*.cpp src/api/*.cpp src/demo/*.cpp src/metrics/*.cpp src/storage/*.cpp

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan repository history for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  container-config:
    name: Container configuration scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan Docker and Compose configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL

  dynamic-security:
    name: OpenAPI fuzz and OWASP ZAP scans
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the service container
        run: docker build --tag custom-db:security .
      - name: Start isolated test service
        run: |
          docker run --detach --rm --name custom-db-security \
            --publish 127.0.0.1:18082:8080 \
            --read-only --cap-drop ALL --security-opt no-new-privileges \
            --pids-limit 128 --memory 512m --cpus 1 \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --volume custom-db-security-data:/data \
            --env PORT=8080 --env DB_PATH=/data/security.db \
            custom-db:security
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18082/readyz; then exit 0; fi
            sleep 1
          done
          docker logs custom-db-security
          exit 1
      - name: Schema-driven API property fuzzing
        run: |
          python3 -m pip install --require-hashes -r tests/api/requirements.txt
          schemathesis run docs/openapi.yaml \
            --base-url http://127.0.0.1:18082 \
            --experimental=openapi-3.1 \
            --rate-limit 4/s \
            --checks all \
            --hypothesis-max-examples 100 \
            --workers 1
      - name: Show test service logs after failure
        if: failure()
        run: |
          docker logs custom-db-security 2>&1 \
            | grep -E '(/api/v1/tables/[^ ]*/rows|/api/v1/snapshot|/api/v1/catalog|/api/v1/inspect/wal|/api/v1/inspect/indexes/[^ ]*/tree|/api/v1/inspect/freelist|/api/v1/admin/checkpoint|"status":(429|503))' \
            | tail -n 1000 || true
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: http://127.0.0.1:18082
          rules_file_name: .zap/rules.tsv
          cmd_options: -J zap-baseline.json
          fail_action: true
          allow_issue_writing: false
      - name: OWASP ZAP OpenAPI scan
        uses: zaproxy/action-api-scan@77dfa9a647bb0f583e39d4df8531634d6ddd8df4 # v0.9.0
        with:
          target: /github/workspace/docs/openapi.yaml
          format: openapi
          rules_file_name: .zap/rules.tsv
          cmd_options: -O http://127.0.0.1:18082 -J zap-api.json
          fail_action: true
          allow_issue_writing: false
      - name: Upload dynamic security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dynamic-security-reports
          path: |
            report_html.html
            report_json.json
            zap-baseline.json
            zap-api.json
          if-no-files-found: ignore
      - name: Stop isolated test service
        if: always()
        run: docker stop custom-db-security || true
