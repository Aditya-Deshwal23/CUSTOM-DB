name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.compiler }} / ${{ matrix.build_type }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    env:
      CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
      CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DRELDB_WERROR=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install strace for the Linux sync check
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: sudo apt-get update && sudo apt-get install -y strace
      - name: Verify disk sync syscalls
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: scripts/verify_disk_syncs.sh build/reldb_disk_sync_probe
      - name: Check metrics honesty
        run: build/reldb_regression_tests --gtest_filter=MetricsTest.NoFabricatedValues
      - name: SQLite SQL differential (10,000 statements)
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: python3 tools/difftest.py --binary build/relational_db --statements 10000
      - name: Verify SQL execution benchmark target
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: cmake --build build --target reldb_sql_execution_benchmarks --parallel
      - name: Verify HTTP examples and shutdown
        run: scripts/verify_resume_claims.sh
      - name: Set up Python for API contract tests
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: python -m pip install -r tests/api/requirements.txt
      - name: Run real-binary API contract tests
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        env:
          RELDB_SERVER_BINARY: ${{ github.workspace }}/build/relational_db
        run: python -m pytest -q tests/api
      - name: Fuzz HTTP API input (200 seeded requests)
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: python tests/api/fuzz_api.py --binary build/relational_db --iterations 200 --seed 731291
      - name: Print known-bug table
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        run: scripts/run_known_bugs.sh build/reldb_regression_tests
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.compiler }}-${{ matrix.build_type }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
            build/server.log
          if-no-files-found: ignore

  asan-ubsan:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DRELDB_SANITIZE=address -DRELDB_WERROR=ON
      - name: Build
        run: cmake --build build-asan --parallel
      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
      - name: Set up Python for ASan API tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install API test dependencies
        run: python -m pip install -r tests/api/requirements.txt
      - name: Run API contract tests with ASan and UBSan binary
        env:
          RELDB_SERVER_BINARY: ${{ github.workspace }}/build-asan/relational_db
        run: python -m pytest -q tests/api
      - name: Fuzz API with ASan and UBSan (200 seeded requests)
        run: python tests/api/fuzz_api.py --binary build-asan/relational_db --iterations 200 --seed 731291
      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-asan-ubsan
          path: build-asan/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  tsan:
    name: Thread sanitizer stress
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DRELDB_SANITIZE=thread -DRELDB_WERROR=ON
      - name: Build
        run: cmake --build build-tsan --parallel
      - name: Prepare TSan runtime
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Run disk manager TSan stress
        run: build-tsan/reldb_regression_tests --gtest_filter=DiskManagerTest.ConcurrentDistinctPageIo
      - name: Run statement-gate TSan stress
        shell: bash
        run: |
          set -o pipefail
          build-tsan/reldb_regression_tests --gtest_filter=ConcurrencyTest.ReaderWriterTsanClean | tee tsan.log
          build-tsan/reldb_regression_tests --gtest_filter=ConcurrencyTest.ExecutorStatementGateTsanClean | tee -a tsan.log
          RELDB_CONCURRENCY_STRESS_SECONDS=10 build-tsan/reldb_regression_tests --gtest_filter=ConcurrencyTest.SqlExecutorStatementGateTsanStress | tee -a tsan.log
      - name: Run WAL timer TSan stress
        run: build-tsan/reldb_regression_tests --gtest_filter=WalTest.NormalModeSyncThreadTsanClean
      - name: Fuzz API middleware concurrently under TSan (200 seeded requests)
        run: python3 tests/api/fuzz_api.py --binary build-tsan/relational_db --iterations 200 --seed 731291 --concurrent
      - name: Upload TSan log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-tsan
          path: tsan.log
          if-no-files-found: ignore

  crash-safety:
    name: WAL hard-kill recovery (200 iterations)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DRELDB_WERROR=ON
      - name: Build regression tests
        run: cmake --build build --parallel --target reldb_regression_tests
      - name: Run seeded crash harness
        run: tools/crashtest build/reldb_regression_tests 200

  formatting-and-lint:
    name: Formatting and Dockerfile lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check changed C++ formatting
        run: |
          git fetch origin "${GITHUB_BASE_REF:-main}" --depth=1
          FORMAT_BASE="origin/${GITHUB_BASE_REF:-main}" scripts/format.sh --check
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  docker-build:
    name: Docker image build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build image without pushing
        run: docker build --tag custom-db:ci .
