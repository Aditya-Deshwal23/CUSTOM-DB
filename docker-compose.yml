services:
  custom-db:
    build:
      context: .
    image: custom-db:local
    init: true
    restart: unless-stopped
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ulimits:
      nofile:
        soft: 1024
        hard: 2048
    env_file:
      - .env.example
    ports:
      - "8080:8080"
    volumes:
      - custom-db-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/app/relational_db", "--healthcheck"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

volumes:
  custom-db-data:
