name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - name: Publish SARIF to code scanning
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
      - name: Upload Scorecard SARIF report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scorecard-sarif
          path: scorecard.sarif
          if-no-files-found: error
      - name: Enforce minimum Scorecard score of 7
        run: |
          score=""
          for attempt in $(seq 1 12); do
            score="$(curl --fail --silent --show-error \
              "https://api.scorecard.dev/projects/github.com/Aditya-Deshwal23/CUSTOM-DB" \
              | jq -r '.score // empty' || true)"
            if [[ -n "${score}" ]]; then break; fi
            sleep 5
          done
          if [[ -z "${score}" ]]; then
            echo "Scorecard API did not return a score" >&2
            exit 1
          fi
          printf 'OpenSSF Scorecard score: %s\n' "${score}"
          awk -v score="${score}" 'BEGIN { exit !(score >= 7) }' || {
            echo "OpenSSF Scorecard score ${score} is below the required 7" >&2
            exit 1
          }
