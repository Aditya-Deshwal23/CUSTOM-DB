name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 4 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          languages: cpp, python, javascript-typescript
          build-mode: manual
          queries: security-extended
      - name: Configure C++ project for CodeQL
        run: cmake -S . -B build-codeql -DCMAKE_BUILD_TYPE=Debug -DRELDB_BUILD_TESTS=OFF -DRELDB_BUILD_BENCHMARKS=OFF
      - name: Build C++ targets for CodeQL
        run: cmake --build build-codeql --parallel --target relational_db
      - name: Analyze and upload SARIF
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3.39.1
        with:
          category: /language:cpp-python-javascript
          fail-on: error
      - name: Fail for open high or critical alerts on this ref
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref }}
        run: |
          sleep 10
          for severity in high critical; do
            count="$(gh api --paginate \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&severity=${severity}&ref=${REF_NAME}" \
              --jq 'length' | awk '{ total += $1 } END { print total + 0 }')"
            if [[ "${count}" -gt 0 ]]; then
              echo "Found ${count} open ${severity} CodeQL alert(s) on ${REF_NAME}" >&2
              exit 1
            fi
          done
