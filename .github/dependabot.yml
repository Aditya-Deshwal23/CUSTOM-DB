version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /tests/api
    schedule:
      interval: weekly
    groups:
      api-test-dependencies:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: /tests/dashboard
    schedule:
      interval: weekly
    groups:
      browser-test-dependencies:
        patterns:
          - "*"
